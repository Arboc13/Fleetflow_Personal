[project]
name = "fleetflow-backend"
version = "0.1.0"
description = "FleetFlow — fleet management backend (FastAPI + PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9",
    "pwdlib[bcrypt]>=0.2.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "apscheduler>=3.10",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
